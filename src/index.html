<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Mirror Mirror</title>
        <meta name="description" content="Mirror mirror on the wall...">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/weather.css">

        <!-- Config (latitude, longitude, tomorrowIoApiKey); see README. Loaded first. -->
        <script src="js/config.js"></script>

        <!-- Vendored locally so the mirror needs no internet to render. -->
        <script src="js/vendor/skycons.js"></script>

        <script src="js/weatherget.js"></script>
        <script src="js/weather.js"></script>
        <script src="js/main.js"></script>
    </head>
    <body id="body">
        <div id="time"></div>
        <div id="date"></div>
        <div id="current">
            <div id="main-icon"><canvas id="weather-icon" width="180" height="180"></canvas></div>
            <div id="current-text">
                <div id="temperature"></div>
                <div id="weatherDynamic"></div>
            </div>
        </div>
        <div id="current-hi-lo"></div>
        <table id="weatherTable"></table>
        <div id="status"></div>
    </body>
</html>
